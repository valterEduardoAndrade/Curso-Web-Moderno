<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Axios #02</title>
    <link rel='stylesheet' href='css/estilo.css'>
    <script src="js/axios.js"></script>
</head>

<body class="conteudo exercicio">
    <h1>Axios Get/Post</h1>
    <div id="get"></div>
    <div id="post"></div>

    <script>
        function exibirResultado(id, dados){

            //csonverti os dados que vieram do servidor
            // em formato de json e transformei em string
            const texto = JSON.stringify(dados) 

            //peguei o id do meu resultado, e atribui os dados convertidos dentro dele
            document.getElementById(id).innerHTML = texto


            //axios('parOuImpar?numero=9').then(resp => exibirResultado('get', resp.data))
 }
            axios.get('parOuImpar', {
                params: {
                    numero: 6
                }
            }).then(resp => exibirResultado('get', resp.data))
        
            axios.post('formulario', {
                nome: 'João',
                sobrenome: 'Silva'
            }).then(res => exibirResultado('post', res.data))

    </script>
</body>
