<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Especificidade CSS</title>
    <style>
        /* https://developer.mozilla.org/pt-BR/docs/Web/CSS/Specificity */
        /*
            Em linhas gerais: . . .;
            
            1. regra com !important
            2. seletores mais especificos
            3. ultima regra processada (empate)
        */

        p { 
            background-color: #aaaa;     
        }

        /* No contexto do !imporant, se ele fosse usado no background-color, ele não funcionaria, pois o background prevalece sobre o background-color, mas no caso do padding que é a mesma tag , ela prevalecera pois esta marcada com !important*/
        /* dentro do caso considerando p e a tag obersevacao, a observacao se prevalece pois ela é mais especifica*/
        .observacao {
            background-color: #5F5;
            border: dashed 5px;
            padding: 200px !important;
            font-size: 40px;
        }

        p.observacao{ 
            padding: 2px;
            background: linear-gradient(to left, red, yellow);
        }

    </style>
</head>

<body>
    <p class='observacao'>Olha essa observação!!!!</p>
</body>

</html>
