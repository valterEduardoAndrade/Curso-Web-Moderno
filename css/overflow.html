<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Overflow</title>
    <style>
        div {
            font-size: 40px;
            height: 100px;
            width: 260px;
            border: solid 3px;
            overflow: hidden; /* o hidden esconde toda a parte que estrapolou */
            overflow: scroll; /* Nesse caso ele cria um scroll para pegar as partes que estrapolaram*/
            overflow-x: scroll;  /* Nesse caso o atributo só vai para o eixo x */
           

        }
    </style>
</head>
<body>
    <div>
        TudoFuncionaMuitoBemEmCSS!!!
        Texto muito grande para caber nessa div.
        Já pensou qual será o comportamento padrão?
    </div>
</body>
</html>
