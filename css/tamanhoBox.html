<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Tamanho Box</title>
    <style>
    *   {
        box-sizing: border-box;
}


        body {
            font-size: 45px;
            margin: 0;
        }

div {
    background-color: deepskyblue;
    text-align: center;
    width: 100%;
    height: 300px;
    padding: 100px;
    border: solid 20px;
    box-sizing: border-box; /* Com o border-box, ele considera todos os elementos de espaçamentos citados anteriormente e faz a sua divisão correta sem estrapolar o tamanho original da pagina*/

}

    </style>
</head>
<body>
    <div>
        O tamanho do Box é...
    </div>
</body>
</html>
