<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Texto</title>
    <link href="https://fonts.googleapis.com/css?family=Indie+Flower" rel="stylesheet">
    <style>
        
        * {
            margin: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        p {
            font-size: 1em;
            font-size: 100%;
            font-size: 16px;
            font-size: 12pt;

            /*Unidades absolutas*/
            font-size: 100px;
            font-size: 72pt; /* pontos, equivalente a 1 polegada*/

            font-size: lin; /* polegada*/

            /*Unidades relativas*/
            font-size: 2.2em; /* Multiplica por 2.2 o da primeira referencia dele(no caso a div)*/
            font-size: 2.2rem; /*Multiplica por 2.2 só que a referencia seria a raiz(tag html) */
            font-size: 50vh; /* no caso ele usa metade do viewport(tamanho do estado em que a tela se encontra)*/
            font-size: 10vw; /* 1/10 da font, 10 avos */

            font-family: monospace;
            font-family: Georgia, serif;
            font-family: 'Indie Flower', cursive ; /*A fonte está entre aspas pois ela foi puxada das fontes do google linkada a partir do href lá emcima */

            font-weight: 900; /*Peso da fonte, dos traços, mas puxando pro negrito */
            font-style: italic;
            text-transform: uppercase;
           /*text-decoration: overline underline line-through; */
           word-spacing: 20px; /* espaço entre as palavras*/
            letter-spacing: 20px; /* esspaço das letras*/
            line-height: 2.5em;
            text-align: center;
        }   

        .botao {
            font-size: 28px;
            text-decoration: none;
            padding: 10px 30px;
            border-radius: 25px;
        }

        .destaque{
            color: #fff;
            background-color: tomato;
            box-shadow: 2px 2px 1px 1px #000
        }

        .destaque:active{
            box-shadow: none;
        }

    </style>
</head>

<body>
    <div>
        <p>
            Que texto
            <br>legal!!!
        </p>
    </div>
    <a href="http://google.com" class="botao destaque">Google</a>
</body>

</html>
