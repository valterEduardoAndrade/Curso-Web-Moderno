<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Acessando Atributos #01</title>
    <link rel='stylesheet' href='css/estilo.css'>
</head>

<body class='conteudo exercicio'>
    <div>
        <a href='https://www.cod3r.com.br'>Cod3r</a>
    </div>
    <div id='primeiro'>
        <img src='http://files.cod3r.com.br/curso-web/logo-estreita.png' alt='logo'>
    </div>
    <script>
        const img = document.querySelector('img')
        console.log('getAttribute', img.getAttribute('src'))
        console.log('src', img.src)
        console.log('["src"]', img['src'])
        console.log('alt', img.alt)

        console.log('Elemento Imagem...................')
        console.log('NodeType' , img.nodeType) /*Nodetype seria como uma  forma  de  identificar algo, por exeplo, se  a resposta no browser for nodetype 1, quer dizer que é um elemento, se for Nodetype 2 é um atributo e assim sucetivamente*/
        console.log('NodeName', img.nodeName) /*O nodename seria para ser especificamente do que se trata, nesse caso o img ele é um IMG e mostrará no browser*/
        
        const src = img.getAttributeNode('src')
        console.log('Atributo "src".................')
        console.log('NodeType', src.nodeType)
        console.log('NodeName', src.nodeName)
        console.log('NodeValue', src.nodeValue)

        const link = document.querySelector('a')
        console.log('Elemento "a"...................')
        console.log('href', link.href)
        console.log('firstChild.nodeType', link.firstChild.nodeType) /*tipo  3(a  palavra cod3r)*/
        link.firstChild.nodeValue  =  'Novo Texto'
        link.innerHTML  = 'Novo texto2'





    </script>
</body>

</html>
