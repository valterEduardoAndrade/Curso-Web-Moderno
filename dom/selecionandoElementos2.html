<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Selecionar Elementos #02</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body class="conteudo exercicio">
    <div id="primeiro">#primeiro</div>
    <div >Segundo</div>
    <div class="terceiro ultimo"><span wb-attrib>.terceiro .ultimo</span></div>
    <script>              
       document.querySelector('#primeiro').classList.add('destaque')

       const selecionar = seletor => 
        document.querySelectorAll(seletor).forEach(e => e.classList.add('destaque'))


        const deselecionar = seletor =>
        document.querySelectorAll(seletor).forEach(e => e.classList.remove('destaque'))


        selecionar('div')   
        
        deselecionar('*')
        selecionar('.terceiro.ultimo') /* Aqui eu seleciono todos que tem a class selecionar e ultimo no mesmo elemento*/
        selecionar('#primeiro')
        deselecionar('*')
 
        selecionar(':not(#primeiro)') /*Nesse caso ele seleciona todos, menos o primeiro, com a pseudoclasse :not + entre () o nome da classe ou id*/

        deselecionar('*')
        selecionar(':nth-child(1)') /*Primeiro filho de todos elementos, todos elementos que tiverem filhos, ele pegará o primeiro e adicionara */

        deselecionar('*')
        selecionar('div:ntn-of-type(1)') /*pegará o primeiro elemento do tipo div*/


        deselecionar('*')
        selecionar('[wb-attrib]')

    </script>
</body>
</html>
