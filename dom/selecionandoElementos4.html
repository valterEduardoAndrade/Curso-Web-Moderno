<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Selecionar Elementos #04</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>

<body class="conteudo exercicio">
    <div>
        <p>Início</p>
    </div>
    <div>
        <ul>
            <li>Pedro</li>
            <li>Ana</li>
            <li>Bia</li>
        </ul>
    </div>
    <div>
        <p>Fim</p>
    </div>
    <script>
        
    /*Mudando o prototype, todos consegue se auto-imprimir,
     pois todos herdam a função log, injetando o log aos objetos nativos
     do navegador */

    function log(){
        console.log(this)
    }

    HTMLCollection.prototype.log = log
    HTMLElement.prototype.log = log
    NodeList.prototype.log = log
    Node.prototype.log = log

    /*Imprimindo o pai com o parentNode*/

    const lista = document.querySelector('div ul')
    lista.parentNode.log() /*Nesse caso a gente acessa o pai*/
    lista.childNodes.log() /*Nesse caso acessa a lista de filhos*/


    /*Imprimindo o primeiro filho e o proximo
      Com firsChild e nextSibling*/

    const primeiro = lista.firstChild
    primeiro.log()
    primeiro.nextSibling.log()

    /*Imprimindo o ultimo filho e o anti-pnultimo
    com o lastChild d previousSibling*/
    
    const ultimo = lista.lastChild
    ultimo.log()
    ultimo.previousSibling.log()
    


    lista.children.log()
    lista.firstElementChild.log() 
    lista.lastElementChild.log()
    lista.parentElement.previousElementSibling.log()
    lista.parentElement.nextElementSibling.log()
    

    document.querySelectorAll('div ul li').log()

    </script>
</body>

</html>
