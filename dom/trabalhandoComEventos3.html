<!DOCTYPE html>
<html>

<head>
    <meta charset='UTF-8'>
    <title>Trabalhando com Eventos #03</title>
    <style>
        body {
            margin: 0;
            display: flex;
        }
        
        .esquerda {
            height: 100vh;
            width: 50%;
            background-color: coral;
        }
        
        .direita {
            height: 100vh;
            width: 50%;
            background-color: cornflowerblue;
        }
        
        .item {
            border: solid 5px black;
            background-color: darkgrey;
            color: white;
            height: 100px;
            font-size: 40px;
            margin: 10px;
            vertical-align: middle;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="esquerda" wm-dropzone>
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
    <div class="direita" wm-dropzone></div>
    <script>
        const items = document.querySelectorAll('[wm-dropzone] .item')
        items.forEach((item, index) => {
            item.draggable = true // : Por padrão, a maioria dos elementos HTML (como <div>) não pode ser arrastada. Essa linha ativa o poder de "arrastável" para cada item.
            item.id = item.id || `draggable-item${index}` // se tiver um id mantem, se não ele cria 
            item.ondragstart = e => { // ondragstart é o event que dispara ao clicar e arrasta o item
                e.dataTransfer.setData('item-id', e.target.id) // guarda o id do item com o rotulo item-id ao arrastar
            }
        })


        const dropzones = document.querySelectorAll('[wm-dropzone]')
        dropzones.forEach(dropzone => {
            dropzone.ondragover = e => e.preventDefault() // Por padrão, o navegador proíbe que você solte coisas dentro de outros elementos. O e.preventDefault() cancela esse comportamento padrão, dizendo ao navegador: "Ei, pode deixar o usuário soltar algo aqui sim!".
            dropzone.ondrop = function(e){
                const id = e.dataTransfer.getData('item-id') // pega o id anteriormente setado
                const item = document.getElementById(id) // com o id do elemento o javascript localiza o elemento real no html
                //e.target.appendChild(item)
                dropzone.appendChild(item) // Move fisicamente o item arrastado para dentro da área de destino. No JavaScript, quando você usa o appendChild com um elemento que já existe na tela, ele muda de lugar (sai de onde estava e vai para o novo destino).
            }
        })


        
    </script>
</body>

</html>
