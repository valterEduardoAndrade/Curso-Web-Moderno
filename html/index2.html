<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicios HTMLL </title>
</head>
<body>
    <header>
        <h1>Exercicios HTML</h1>
    </header>

    <nav>
        <a href="exercicios/teste.html"> 00 - Teste</a>
        <a href="exercicios/temp.html">TEMPPP</a>
    </nav>

    <section id="conteudo"> </section>
          
    <footer>
        <br>
        Curso de Web Moderno
    </footer>

    <script> 
        document.querySelectorAll('a').forEach(link =>{
            const conteudo = document.getElementById('conteudo')
           
            link.onclick = function(e) {
                e.preventDefault()
                fetch(link.href)
                    .then(resp => resp.text())
                    .then(html => conteudo.innerHTML = html)
                
            }
        }) 
    </script>
</body>
</html>


<!---o document.querySelectorAll, serve para intercepitar todos os linkss /
             o fetch usado na linha 30 serve para fazer uma requisição ajax
            o innerHTML substitui o conteúdo do elemento HTML--->
